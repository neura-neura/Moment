name: Release Moment

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Restore dependencies
        run: npm ci

      - name: Build the native installer
        run: npm run package:bridge

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = "quick-capture-bridge-winui/dist/MomentSetup-x64.exe"
          (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash | Out-File "$installer.sha256" -Encoding ascii

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            quick-capture-bridge-winui/dist/MomentSetup-x64.exe `
            quick-capture-bridge-winui/dist/MomentSetup-x64.exe.sha256 `
            --title "Moment $env:GITHUB_REF_NAME" `
            --generate-notes
